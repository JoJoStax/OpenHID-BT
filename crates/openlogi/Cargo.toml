[package]
name = "openhid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenHID/BT command-line interface — universal, local-first companion for Logitech HID++ and Bluetooth peripherals."
keywords = ["logitech", "hidpp", "hid", "bluetooth", "qcy", "cli"]
categories = ["command-line-utilities", "hardware-support"]
readme = "../../README.md"

[[bin]]
name = "openhid"
path = "src/main.rs"

[dependencies]
openlogi-cli = { path = "../openlogi-cli", version = "0.8.14" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
