name: Windows MSI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows-msi:
    name: Build Windows MSI (${{ matrix.arch }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            msi_platform: x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msi_platform: arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build OpenHID/BT Windows executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release \
            -p openhid-desktop \
            -p openhid-overlay \
            -p openhid-agent \
            -p openhid \
            --target ${{ matrix.target }}

      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2
          wix extension add --global WixToolset.Util.wixext/6.0.2

      - name: Build Windows MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1)
          $version = if ($versionLine) { $versionLine.Matches[0].Groups[1].Value } else { '0.9.0' }
          $targetDir = "target\${{ matrix.target }}\release"

          $gui = Get-Item "$targetDir\OpenLogi.exe"
          $overlay = Get-Item "$targetDir\openhid-overlay.exe"
          $agent = Get-Item "$targetDir\openhid-agent.exe"
          $cli = Get-Item "$targetDir\openhid.exe"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msiName = "OpenHID-BT-$version-windows-${{ matrix.arch }}.msi"
          $msiPath = "dist\$msiName"

          wix build packaging\windows\OpenLogi.wxs `
            -ext WixToolset.UI.wixext `
            -ext WixToolset.Util.wixext `
            -arch ${{ matrix.msi_platform }} `
            -d Version=$version `
            -d ExeFile="$($gui.FullName)" `
            -d AgentExeFile="$($agent.FullName)" `
            -d OverlayExeFile="$($overlay.FullName)" `
            -d CliExeFile="$($cli.FullName)" `
            -o $msiPath

          $hash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash.ToLower()
          "$hash  $msiName" | Out-File -FilePath "$msiPath.sha256" -Encoding ascii

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenHID-BT-MSI-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.msi.sha256

      - name: Publish Windows MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.msi.sha256
          generate_release_notes: true
